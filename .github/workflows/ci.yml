# CI pipeline: lint -> unit tests -> train model.
# Each job only runs if the previous one passed, and any failing command
# (lint error, failing test, training crash) fails the whole workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

defaults:
  run:
    shell: bash # GitHub runs this as "bash -eo pipefail": stop on the first error

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Check code style and errors
        run: ruff check . --output-format=github
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Unit tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Upload test report
        if: always() # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  train:
    name: Train model
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Clean the raw data
        run: python src/preprocess.py
      - name: Train, tune and log to MLflow
        run: python -m src.train 2>&1 | tee training-log.txt
      - name: Smoke test the trained model
        run: python -m src.predict data/sample_request.json
      - name: Upload model, MLflow runs and logs
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/
            mlruns/
            report/tuning/
            screenshots/models/
            training-log.txt

  docker:
    name: Build and test Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t heart-disease-api:ci .
      - name: Start container
        run: docker run -d --name api -p 8000:8000 heart-disease-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Call /predict with a sample patient
        run: |
          curl -sf -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":67,"sex":1,"cp":4,"trestbps":160,"chol":286,"fbs":0,"restecg":2,"thalach":108,"exang":1,"oldpeak":1.5,"slope":2,"ca":3,"thal":3}' \
            | tee predict-response.json
          grep -q '"prediction":1' predict-response.json
      - name: Show container logs
        if: always()
        run: docker logs api
