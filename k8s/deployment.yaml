# Runs the heart disease API in Kubernetes.
# Apply with: kubectl apply -f k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  replicas: 2 # two pods: if one crashes, the other keeps serving
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
      annotations:
        # Tell Prometheus to scrape this pod's /metrics endpoint (Step 8)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: heart-disease-api:1.0
          # The image was loaded into Minikube with "minikube image load",
          # so never try to download it from a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests: # what the scheduler reserves for each pod
              cpu: 100m
              memory: 256Mi
            limits: # the pod is throttled / restarted above this
              cpu: 500m
              memory: 512Mi
          readinessProbe: # only send traffic once the model is loaded
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # restart the container if it stops answering
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
